# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: esnoticias24h/esnoticias
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/d47bceae-b415-4992-9497-e0886bf72990/pkce
  auth_token_endpoint: /sites/d47bceae-b415-4992-9497-e0886bf72990/token
  gateway_url: https://gateway.decapbridge.com
  # Ver quién hizo cada cambio (opcional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Campos PKCE (opcional, recomendado)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Logo Decap + Bridge (opcional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Enlaces del sitio en Decap CMS (opcional)
site_url: https://esnoticias.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Categoría", name: "categoria", widget: "select", options: ["Nacional", "Internacional", "Economía", "Tecnología", "Cultura", "Opinión"] }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor", name: "autor", widget: "string", default: "Redacción EsNoticias" }
      - { label: "Imagen destacada", name: "imagen", widget: "image", required: false }
      - { label: "Entradilla (resumen corto)", name: "resumen", widget: "text" }
      - { label: "Cuerpo de la noticia", name: "body", widget: "markdown" }
