backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Categoría", name: "categoria", widget: "select", options: ["Nacional", "Internacional", "Economía", "Tecnología", "Cultura", "Opinión"] }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor", name: "autor", widget: "string", default: "Redacción EsNoticias" }
      - { label: "Imagen destacada", name: "imagen", widget: "image", required: false }
      - { label: "Entradilla (resumen corto)", name: "resumen", widget: "text" }
      - { label: "Cuerpo de la noticia", name: "body", widget: "markdown" }
